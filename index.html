<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Asu!</title>
<style>
body{margin:0;overflow:hidden;background:#050505;font-family:Arial;user-select:none}
#ui{position:fixed;top:10px;left:10px;color:white;z-index:10;font-size:24px;font-weight:bold;line-height:1.4;display:none;pointer-events:none}
#help{position:fixed;bottom:10px;left:10px;color:white;z-index:10;font-size:16px;display:none;pointer-events:none}
canvas{display:block}

/* Botão Sair para Mobile */
#btnSair{position:fixed;top:15px;right:15px;z-index:30;background:#ff3333;color:white;border:none;padding:12px 20px;font-size:16px;font-weight:bold;border-radius:8px;cursor:pointer;display:none;box-shadow:0 4px 10px rgba(255,51,51,0.3)}
#btnSair:hover{background:#ff5555}

/* Menu de Dificuldade */
.menu-panel{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:white;text-align:center;z-index:20;background:rgba(20,20,20,0.95);padding:30px;border-radius:15px;border:2px solid #333;box-shadow:0 0 20px rgba(255,255,255,0.1);width:320px}
h1{margin-top:0;font-size:26px;color:#ff66aa;text-transform:uppercase;letter-spacing:2px}
.btn{display:block;width:100%;padding:15px;margin:12px 0;background:#222;color:white;border:2px solid #444;border-radius:8px;font-size:18px;font-weight:bold;cursor:pointer;transition:0.2s}
.btn:hover{background:#ff66aa;color:white;border-color:#ff66aa;transform:scale(1.03)}

.facil-btn:hover{background:#22ff22;border-color:#22ff22;color:black}
.medio-btn:hover{background:#ffff22;border-color:#ffff22;color:black}
.dificil-btn:hover{background:#ff2222;border-color:#ff2222;color:white}

.toggle-container{margin-top:20px;background:#151515;padding:12px;border-radius:8px;border:1px solid #444;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer}
.toggle-container input{cursor:pointer;width:18px;height:18px}
</style>
</head>
<body>

<button id="btnSair" onclick="backToMenu()">❌ SAIR</button>

<div id="menuDificuldade" class="menu-panel">
    <h1>Asu!</h1>
    <button class="btn facil-btn" onclick="applyDifficulty('facil')">🟢 Fácil</button>
    <button class="btn medio-btn" onclick="applyDifficulty('medio')">🟡 Médio</button>
    <button class="btn dificil-btn" onclick="applyDifficulty('dificil')">🔴 Difícil</button>
    
    <label class="toggle-container">
        <input type="checkbox" id="mobileCheck">
        <span>📱 Ativar Modo Mobile</span>
    </label>
</div>

<div id="ui">
    Pontos: <span id="score">0</span><br>
    Combo: <span id="combo" style="color:#ff66aa">0</span>
</div>
<div id="help">PC: Digite a letra do círculo mais antigo | Celular: Toque nos círculos | ESC para Menu</div>

<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

const hitObjects = [];
let score = 0;
let combo = 0;

let gameRunning = false;
let gameLoopId = null;
let spawnInterval = null;
let isMobileMode = false;

// Letras que podem aparecer na tela
const letterPool = ["A", "S", "D", "F", "J", "K", "L", "Ç"];

const difficulties = {
    facil: { circleRadius: 55, approachSpeed: 0.012, spawnRate: 1100 },
    medio: { circleRadius: 42, approachSpeed: 0.02, spawnRate: 800 },
    dificil: { circleRadius: 32, approachSpeed: 0.031, spawnRate: 500 }
};

let currentRadius = 42;
let currentApproachSpeed = 0.02;

let audioCtx = null;

function playHitSound() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    
    osc.type = 'sine';
    osc.frequency.setValueAtTime(800, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.06);
    
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.06);
    
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    osc.start();
    osc.stop(audioCtx.currentTime + 0.06);
}

function applyDifficulty(diffKey) {
    const diff = difficulties[diffKey];
    currentRadius = diff.circleRadius;
    currentApproachSpeed = diff.approachSpeed;

    isMobileMode = document.getElementById("mobileCheck").checked;

    document.getElementById("menuDificuldade").style.display = "none";
    document.getElementById("ui").style.display = "block";
    document.getElementById("help").style.display = isMobileMode ? "none" : "block";
    document.getElementById("btnSair").style.display = isMobileMode ? "block" : "none";
    
    gameRunning = true;
    score = 0;
    combo = 0;
    hitObjects.length = 0;
    
    document.getElementById("score").textContent = score;
    document.getElementById("combo").textContent = combo;

    clearInterval(spawnInterval);
    spawnInterval = setInterval(spawnCircle, diff.spawnRate);

    if(gameLoopId) cancelAnimationFrame(gameLoopId);
    gameLoopId = requestAnimationFrame(animate);
}

function backToMenu() {
    gameRunning = false;
    clearInterval(spawnInterval);
    document.getElementById("menuDificuldade").style.display = "block";
    document.getElementById("ui").style.display = "none";
    document.getElementById("help").style.display = "none";
    document.getElementById("btnSair").style.display = "none";
    ctx.clearRect(0, 0, canvas.width, canvas.height);
}

function spawnCircle() {
    if (!gameRunning) return;

    const margin = currentRadius * 2;
    const x = margin + Math.random() * (canvas.width - margin * 2);
    const y = margin + Math.random() * (canvas.height - margin * 2);
    
    // Escolhe uma letra aleatória da lista
    const randomLetter = letterPool[Math.floor(Math.random() * letterPool.length)];

    hitObjects.push({
        x: x,
        y: y,
        letter: randomLetter,
        approachScale: 3.5,
        color: `hsl(${Math.random() * 360}, 85%, 65%)`
    });
}

// Mecânica de acerto por Teclado (PC)
function checkKeyboardHit(pressedKey) {
    if (!gameRunning || hitObjects.length === 0) return;

    // No Osu!, você precisa acertar o círculo mais antigo na tela primeiro (índice 0)
    const oldestObject = hitObjects[0];

    if (pressedKey === oldestObject.letter.toLowerCase()) {
        // Acertou a letra do círculo certo!
        combo++;
        let accuracyMult = oldestObject.approachScale < 1.3 && oldestObject.approachScale > 0.9 ? 3 : 1;
        
        score += 100 * accuracyMult;
        playHitSound();
        hitObjects.shift(); // Remove o primeiro item
        
        document.getElementById("score").textContent = score;
        document.getElementById("combo").textContent = combo;
    } else {
        // Apertou a letra errada
        resetCombo();
    }
}

// Mecânica de acerto por Touch (Mobile)
function checkTouchHit(clickX, clickY) {
    if (!gameRunning) return;

    let hitRegistered = false;

    for (let i = 0; i < hitObjects.length; i++) {
        const obj = hitObjects[i];
        const dist = Math.hypot(clickX - obj.x, clickY - obj.y);

        if (dist <= currentRadius) {
            hitObjects.splice(i, 1);
            hitRegistered = true;
            
            combo++;
            let accuracyMult = obj.approachScale < 1.3 && obj.approachScale > 0.9 ? 3 : 1;

            score += 100 * accuracyMult;
            playHitSound();
            
            document.getElementById("score").textContent = score;
            document.getElementById("combo").textContent = combo;
            break;
        }
    }

    if (!hitRegistered) {
        resetCombo();
    }
}

function resetCombo() {
    combo = 0;
    document.getElementById("combo").textContent = combo;
}

// Captura de digitação do teclado
window.addEventListener("keydown", e => {
    if (e.key === "Escape") {
        backToMenu();
        return;
    }
    // Envia a tecla pressionada em minúsculo
    checkKeyboardHit(e.key.toLowerCase());
});

// Captura de toque na tela
canvas.addEventListener("touchstart", e => {
    e.preventDefault();
    if(e.touches.length > 0){
        const touchX = e.touches.clientX;
        const touchY = e.touches.clientY;
        
        if (isMobileMode && touchY < 70 && touchX > window.innerWidth - 120) {
            return; 
        }

        checkTouchHit(touchX, touchY);
    }
});

function animate() {
    if (!gameRunning) return;
    gameLoopId = requestAnimationFrame(animate);
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (let i = hitObjects.length - 1; i >= 0; i--) {
        const obj = hitObjects[i];
        
        obj.approachScale -= currentApproachSpeed;

        if (obj.approachScale <= 0.8) {
            hitObjects.splice(i, 1);
            resetCombo();
            continue;
        }

        // 1. Anel de aproximação externo
        ctx.beginPath();
        ctx.arc(obj.x, obj.y, currentRadius * obj.approachScale, 0, Math.PI * 2);
        ctx.strokeStyle = obj.color;
        ctx.lineWidth = 3;
        ctx.stroke();

        // 2. Círculo principal
        ctx.beginPath();
        ctx.arc(obj.x, obj.y, currentRadius, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(15, 15, 15, 0.85)";
        ctx.fill();
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 4;
        ctx.stroke();

        // 3. Renderização da letra centralizada dentro do círculo
        ctx.fillStyle = "#ffffff";
        ctx.font = `bold ${currentRadius * 0.9}px Arial`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(obj.letter, obj.x, obj.y);
    }
}
</script>
</body>
</html>
